esphome:
  name: weatherman
  friendly_name: Weatherman

esp32:
  board: esp32dev
  framework:
    type: arduino

logger:

api:
  encryption:
    key: !secret api_encryption_key
  actions:
  - action: forecast_update
    variables:
      day_1_ts: int
      day_1_condition: string
      day_1_high: float
      day_1_low: float
      day_2_ts: int
      day_2_condition: string
      day_2_high: float
      day_2_low: float
      day_3_ts: int
      day_3_condition: string
      day_3_high: float
      day_3_low: float
    then:
    - lambda: |-
        auto valid_temperature = [](float value) -> float {
          return std::isfinite(value) && value >= -100 && value <= 100 ? value : NAN;
        };
        id(forecast_dates) = {day_1_ts, day_2_ts, day_3_ts};
        id(forecast_conditions) = {day_1_condition, day_2_condition, day_3_condition};
        id(forecast_highs) = {valid_temperature(day_1_high), valid_temperature(day_2_high), valid_temperature(day_3_high)};
        id(forecast_lows) = {valid_temperature(day_1_low), valid_temperature(day_2_low), valid_temperature(day_3_low)};
        id(forecast_received_ms) = millis();
        ESP_LOGD("forecast", "Daily forecast received; next scheduled refresh will display it");
ota:
- platform: esphome
  password: !secret ota_password
wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
globals:
- id: refresh_count
  type: int
  restore_value: yes
  initial_value: '0'

- id: forecast_dates
  type: std::array<int, 3>
  restore_value: false
  initial_value: '{0, 0, 0}'
- id: forecast_conditions
  type: std::array<std::string, 3>
  restore_value: false
  initial_value: '{"", "", ""}'
- id: forecast_highs
  type: std::array<float, 3>
  restore_value: false
  initial_value: '{NAN, NAN, NAN}'
- id: forecast_lows
  type: std::array<float, 3>
  restore_value: false
  initial_value: '{NAN, NAN, NAN}'
- id: forecast_received_ms
  type: uint32_t
  restore_value: false
  initial_value: '0'
